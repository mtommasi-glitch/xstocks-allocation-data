name: Refresh xStocks Allocation Data

# Keeps data.json's idle-balance snapshot fresh (7 days/week, weekends included) so the
# xStocks Allocation Slack routine's 3-hour staleness check never blocks a scheduled post.
# Runs here rather than in a Claude cloud routine because it needs the DEBANK_API_KEY secret
# and plain outbound HTTPS to pro-openapi.debank.com — a GitHub-hosted runner, not a routine
# sandbox behind an egress proxy (see kraken-earn-dashboard's boosted-usdc-aave-alert.yml for
# the same pattern applied to a different vault's on-chain check).
#
# GitHub's scheduler is best-effort: scheduled runs are routinely delayed or silently dropped
# (on 2026-09-28 neither the hourly run nor the single 12:15 pre-cycle run fired between 07:02
# and 12:38 UTC, so the AM routine found 5.5h-old data and skipped). So instead of one
# pre-cycle run, the AM window gets a burst of attempts every 10 min from 11:33 to 12:13 UTC —
# any one of them landing is enough. Minutes avoid :00, when GitHub drops the most runs.
# The AM Allocation routine itself also re-checks every 5 min for up to 60 min if it still
# finds stale data, so a late refresh here is picked up rather than skipping the cycle.
# (The PM Allocation cycle was retired on 2026-09-28; its pre-cycle run was removed.)
on:
  schedule:
    - cron: '20 * * * *'                  # hourly, well inside the 3h staleness window
    - cron: '33,43,53 11 * * 1-5'         # AM pre-cycle burst (routine fires 12:20 UTC weekdays)
    - cron: '3,13 12 * * 1-5'             # AM pre-cycle burst, continued
  workflow_dispatch: {}

permissions:
  contents: write

# Several burst runs can overlap when GitHub delivers them late in a clump; serialize them so
# the pushes don't race each other.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Retry transient DeBank/Kamino API failures: up to 3 attempts, 60s apart.
      - name: Refresh data.json
        run: |
          for attempt in 1 2 3; do
            node refresh-data.mjs && exit 0
            echo "Attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1
        env:
          DEBANK_API_KEY: ${{ secrets.DEBANK_API_KEY }}
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh xStocks allocation data"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
