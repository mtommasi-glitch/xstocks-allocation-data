name: Refresh xStocks Allocation Data

# Keeps data.json's idle-balance snapshot fresh (7 days/week, weekends included) so the
# xStocks Allocation Slack routine's 3-hour staleness check never blocks a scheduled post.
# Runs here rather than in a Claude cloud routine because it needs plain outbound HTTPS to the
# Ink RPC, Jupiter, Kamino and Veda APIs — a GitHub-hosted runner, not a routine sandbox behind
# an egress proxy. Balances are read on-chain (no DeBank since 2026-10-15, when exhausted DeBank
# credits made every refresh fail and blocked the AM tickets).
#
# GitHub's scheduler is best-effort: scheduled runs are routinely delayed or silently dropped
# (on 2026-09-28 neither the hourly run nor the single 12:15 pre-cycle run fired between 07:02
# and 12:38 UTC, so the AM routine found 5.5h-old data and skipped). So instead of one
# pre-cycle run, the AM window gets a burst of attempts every 10 min from 11:33 to 12:13 UTC —
# any one of them landing is enough. Minutes avoid :00, when GitHub drops the most runs.
# The AM Allocation routine itself also re-checks every 5 min for up to 60 min if it still
# finds stale data, so a late refresh here is picked up rather than skipping the cycle.
# (The PM Allocation cycle was retired on 2026-09-28; its pre-cycle run was removed.)
# Push trigger (added 2026-11-17): the hourly external workflow_dispatch stopped at 08:29 UTC on 17 Nov
# (it was a session-only cron that expired) and GitHub's scheduler dropped every run until 13:54, so the
# AM routine skipped. Now, when the AM routine finds stale data, it pushes a branch named
# claude/refresh-trigger-<epoch>. Push events are delivered reliably (unlike schedule), so this
# refreshes data.json on main within ~1 minute and then deletes the trigger branch.
on:
  push:
    branches: ['claude/refresh-trigger-**']
  schedule:
    - cron: '20 * * * *'                  # hourly, well inside the 3h staleness window
    - cron: '33,43,53 11 * * 1-5'         # AM pre-cycle burst (routine fires 12:20 UTC weekdays)
    - cron: '3,13 12 * * 1-5'             # AM pre-cycle burst, continued
  workflow_dispatch: {}

permissions:
  contents: write

# Several burst runs can overlap when GitHub delivers them late in a clump; serialize them so
# the pushes don't race each other.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Retry transient Ink RPC / Jupiter / Kamino / Veda API failures: up to 3 attempts, 60s apart.
      - name: Refresh data.json
        run: |
          for attempt in 1 2 3; do
            node refresh-data.mjs && exit 0
            echo "Attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh xStocks allocation data"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Delete trigger branch
        if: always() && github.event_name == 'push'
        run: git push origin --delete "$GITHUB_REF_NAME" || true
